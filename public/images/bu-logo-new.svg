<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#f5f5f5" stroke="#e0e0e0" stroke-width="2"/>
  
  <!-- Bangla text at top (বরিশাল বিশ্ববিদ্যালয়) -->
  <text x="100" y="35" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#000">বরিশাল বিশ্ববিদ্যালয়</text>
  
  <!-- Book pages -->
  <polygon points="60,60 75,50 90,60 90,100" fill="#808080"/>
  <polygon points="110,60 125,50 140,60 140,100" fill="#606060"/>
  
  <!-- Light rays -->
  <line x1="70" y1="50" x2="70" y2="30" stroke="#999" stroke-width="2"/>
  <line x1="85" y1="40" x2="95" y2="20" stroke="#999" stroke-width="2"/>
  <line x1="100" y1="38" x2="100" y2="15" stroke="#999" stroke-width="2"/>
  <line x1="115" y1="40" x2="105" y2="20" stroke="#999" stroke-width="2"/>
  <line x1="130" y1="50" x2="130" y2="30" stroke="#999" stroke-width="2"/>
  
  <!-- Water drop -->
  <path d="M 100 70 Q 95 85 95 95 Q 95 105 100 110 Q 105 105 105 95 Q 105 85 100 70" fill="#666"/>
  
  <!-- Bottom banner (black) -->
  <rect x="40" y="135" width="120" height="35" fill="#000" rx="3"/>
  <text x="100" y="160" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">বরিশাল বিশ্ববিদ্যালয়</text>
</svg>